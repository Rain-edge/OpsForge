# OpsForge 本地适配：上游 compose（docs/docker/docker-compose.yml）禁改。
# 官方宿主绝对路径挂载在 Docker Desktop (WSL2) 会落入虚拟机内部，改命名卷。
# 换用自建镜像 opsforge-spug:4.0（官方镜像薄叠加，见 lab/docker/Dockerfile）——
#   代码与前端产物已内置镜像，/data/spug 不再挂 spug-service 卷（旧卷保留未删可回滚）；
#   storage 与 repos 继续挂卷持久化。
# 启动命令（RUNBOOK 同步维护）：
#   docker compose -f docs/docker/docker-compose.yml -f docker-compose.override.yml up -d
services:
  db:
    volumes: !override
      - spug-db:/var/lib/mysql
  spug:
    image: opsforge-spug:4.0
    build:
      # compose 的 project directory 取第一个 -f 文件所在目录（docs/docker/），
      # 故 context 需上跳两级到仓库根；dockerfile 相对 context 解析
      context: ../..
      dockerfile: lab/docker/Dockerfile
    volumes: !override
      - spug-repos:/data/repos
      - spug-storage:/data/spug/spug_api/storage
    ports: !override
      # 平台入口（官方 compose 的 80:80，此处显式声明未被 override 覆盖掉）
      - "80:80"
      # 告警自愈消息 mock 接收端（容器内 9999）：映射到宿主 8002，
      # 演示时可直接用浏览器看自愈报告消息（mock_webhook.py 头注引用此端口）
      - "8002:9999"

volumes:
  spug-db:
  spug-repos:
  spug-storage:
