# heal-nginx.yml — Nginx 自愈修复册
#
# 由告警自愈链路触发（HealRule），对告警主机重启 Nginx。
# 与部署册（nginx.yml）的区别：只做"恢复服务"最小动作，不安装、不下发配置——
# 自愈动作要短平快（端到端 ≤60s 验收），且不应在故障时刻引入配置变更变量。
# 恢复路径兜底：若 systemd 单元被误 disable，一并拉回 enabled（幂等）。
- hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: 重启 Nginx 并确保开机自启
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true

    - name: 确认进程已拉起（立即失败快，不等复检才发现）
      ansible.builtin.command: pgrep -x nginx
      changed_when: false
